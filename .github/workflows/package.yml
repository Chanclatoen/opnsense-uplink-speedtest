name: package

# Builds the FreeBSD package on a real FreeBSD VM, attaches it to the GitHub Release of
# the tag, and publishes the signed pkg repository to the gh-pages branch that GitHub
# Pages serves. Runs on any v* tag; a tag with a suffix (v1.2.1-test1) builds the same
# package but marks the release as a pre-release, which is how a build is tried out.
#
# Nothing is kept as a workflow artifact on purpose: the release and the branch are the
# output, and artifact storage is a quota this account has no room in.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and check it against the tag
        id: meta
        run: |
          version=$(sed -n 's/^PLUGIN_VERSION=[[:space:]]*//p' Makefile)
          if [ -z "$version" ]; then echo "no PLUGIN_VERSION in Makefile" >&2; exit 1; fi
          prerelease=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            case "$GITHUB_REF_NAME" in
              "v$version")   ;;
              "v$version"-*) prerelease=true ;;
              *) echo "tag $GITHUB_REF_NAME does not match PLUGIN_VERSION $version" >&2; exit 1 ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Check the old-name migration still reads a legacy tree
        run: sh tools/test-legacy-migrate.sh

      - name: Place the repository signing key
        env:
          PKG_REPO_KEY: ${{ secrets.PKG_REPO_KEY }}
        run: |
          if [ -z "$PKG_REPO_KEY" ]; then echo "the PKG_REPO_KEY secret is not set" >&2; exit 1; fi
          umask 077
          printf '%s\n' "$PKG_REPO_KEY" > .signkey

      - name: Build the package and sign the repository
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          usesh: true
          copyback: true
          run: sh ./tools/ci-build-repo.sh

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f .signkey

      - name: Check that the build produced what the release needs
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          test -s "dist/os-uplink-speedtest-$VERSION.pkg"
          test -s "dist/os-uplink-speedtest-$VERSION.pkg.sha256"
          test -s dist/site/pkg/meta.conf
          test -s dist/site/pkg/packagesite.pkg
          test -s "dist/site/pkg/All/os-uplink-speedtest-$VERSION.pkg"
          test -s dist/site/uplink-speedtest.pub
          test -s dist/site/uplink-speedtest.conf
          test ! -e dist/site/.signkey

      # The branch holds only the current repository: a pkg repository serves what it
      # serves, and every earlier version stays downloadable from its own release.
      - name: Publish the repository to gh-pages
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist/site
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "pkg repository for $GITHUB_REF_NAME"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Create the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          notes=$(printf '%s\n' \
            "Install on OPNsense 26.x as root:" \
            '' \
            '```' \
            "pkg install -y py313-speedtest-cli iperf3" \
            "pkg add https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/os-uplink-speedtest-$VERSION.pkg" \
            '```' \
            '' \
            "Or add the signed package repository once and install from System - Firmware - Plugins; see the README.")
          set -- --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "$notes"
          if [ "$PRERELEASE" = true ]; then set -- "$@" --prerelease; fi
          gh release create "$GITHUB_REF_NAME" "$@" \
            "dist/os-uplink-speedtest-$VERSION.pkg" "dist/os-uplink-speedtest-$VERSION.pkg.sha256"
