# Package repository for os-uplink-speedtest.
# Copy to /usr/local/etc/pkg/repos/uplink-speedtest.conf on the firewall, with the
# public key at the path below. Priority stays under OPNsense's own repository (11),
# so nothing here can shadow an official package.
uplink-speedtest: {
  url: "https://chanclatoen.github.io/opnsense-uplink-speedtest/pkg",
  signature_type: "pubkey",
  pubkey: "/usr/local/etc/pkg/keys/uplink-speedtest.pub",
  priority: 1,
  enabled: yes
}
