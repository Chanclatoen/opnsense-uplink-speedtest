[run]
command:/usr/local/bin/flock -n -o /tmp/uplink-speedtest.lock /usr/local/opnsense/scripts/OPNsense/UplinkSpeedtest/uplink_speedtest.py run
parameters:
type:script_output
message:running uplink speedtest
description:Run uplink speedtest

[runwith]
command:/usr/local/bin/flock -n -o /tmp/uplink-speedtest.lock /usr/local/opnsense/scripts/OPNsense/UplinkSpeedtest/uplink_speedtest.py run
parameters:%s
type:script_output
message:running uplink speedtest with provider %s

[servers]
command:/usr/local/opnsense/scripts/OPNsense/UplinkSpeedtest/uplink_speedtest.py servers
parameters:
type:script_output
message:listing nearest speedtest servers

[searchservers]
command:/usr/local/opnsense/scripts/OPNsense/UplinkSpeedtest/uplink_speedtest.py servers
parameters:%s
type:script_output
message:searching speedtest servers for %s

[selftest]
command:/usr/local/opnsense/scripts/OPNsense/UplinkSpeedtest/uplink_speedtest.py selftest
parameters:
type:script_output
message:speedtest plugin self-check
